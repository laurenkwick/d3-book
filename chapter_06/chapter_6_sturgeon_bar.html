<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>D3: Loading data from a CSV file</title>
		<script type="text/javascript" src="../d3.js"></script>
		<style type="text/css">
		
			div.bar {
				display: inline-block;
				width: 20px;
				height: 75px;	/* Gets overridden by D3-assigned height below */
				margin-right: 2px;
				background-color: teal;
			}
		
		</style>

	</head>
	<body>
		<script type="text/javascript">

			var dataset

			var rowConverter = function(d) {
				return {
					Hub: d.Hub,
					Count: parseFloat(d.Count),
					HubLatitude: parseFloat(d.HubLatitude),
					HubLongitude: parseFloat(d.HubLongitude)
				};
			}

			d3.csv("sturgeon_data.csv", rowConverter, function(error, data) {

				if (error) { // If error is not null, something went wrong
					console.log(error); // Log the error

				} else { // If no error, the file loaded correctly
					console.log(data); // Log the data
					dataset = data;

					var w = 1500;
					var h = 500;

					var bar = d3.select("body").selectAll("div")
						.data(dataset)
						.enter()
						.append("div")
						.attr("class", "bar")
						.style("height"), function(d) {
							var barHeight = d.Count * 0.1
							return barHeight + "px";
						};
				};
			});

		</script>
	</body>
</html>
